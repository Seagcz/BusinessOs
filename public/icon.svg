<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="50%" stop-color="#0c172e" />
      <stop offset="100%" stop-color="#050813" />
    </linearGradient>

    <!-- Solana Gradient -->
    <linearGradient id="solanaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3" />
      <stop offset="100%" stop-color="#DC1FFF" />
    </linearGradient>

    <!-- Cyan Blue Glow Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Store Canopy Blue Gradient -->
    <linearGradient id="canopyBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="none" stroke="url(#solanaGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Glowing background aura -->
  <circle cx="256" cy="240" r="140" fill="#00FFA3" fill-opacity="0.12" filter="url(#glow)"/>
  <circle cx="340" cy="300" r="110" fill="#DC1FFF" fill-opacity="0.12" filter="url(#glow)"/>

  <!-- Orbiting Blockchain Data Cubes Path -->
  <ellipse cx="270" cy="270" rx="170" ry="90" fill="none" stroke="url(#solanaGrad)" stroke-width="6" stroke-dasharray="12 8" transform="rotate(-20 270 270)" opacity="0.75"/>

  <!-- Orbiting 3D Blockchain Cubes -->
  <g transform="translate(390, 160) scale(0.85)">
    <polygon points="20,0 40,10 40,30 20,40 0,30 0,10" fill="#2563eb" />
    <polygon points="20,0 40,10 20,20 0,10" fill="#38bdf8" />
    <polygon points="20,20 40,10 40,30 20,40" fill="#1d4ed8" />
  </g>
  <g transform="translate(420, 240) scale(0.95)">
    <polygon points="20,0 40,10 40,30 20,40 0,30 0,10" fill="#7c3aed" />
    <polygon points="20,0 40,10 20,20 0,10" fill="#00FFA3" />
    <polygon points="20,20 40,10 40,30 20,40" fill="#DC1FFF" />
  </g>

  <!-- Big Stylized 3D 'B' Storefront Body -->
  <path d="M150 110 C150 90, 170 70, 200 70 L280 70 C350 70, 390 110, 390 170 C390 210, 360 235, 330 245 C370 260, 400 295, 400 350 C400 420, 340 450, 270 450 L180 450 C160 450, 150 440, 150 420 Z" fill="#0369a1" opacity="0.95"/>
  <path d="M165 125 C165 110, 180 90, 210 90 L280 90 C335 90, 370 120, 370 170 C370 205, 345 225, 310 235 C350 250, 380 280, 380 340 C380 400, 330 430, 265 430 L185 430 C170 430, 165 420, 165 405 Z" fill="#0284c7"/>

  <!-- Storefront White & Blue Striped Awning (Canopy) -->
  <g transform="translate(175, 120)">
    <rect x="0" y="0" width="160" height="24" rx="4" fill="#0284c7" />
    <!-- Awning stripes -->
    <path d="M0 0 L22 0 L15 50 L0 50 Z" fill="#2563eb" />
    <path d="M22 0 L45 0 L40 50 L15 50 Z" fill="#f8fafc" />
    <path d="M45 0 L68 0 L65 50 L40 50 Z" fill="#2563eb" />
    <path d="M68 0 L92 0 L90 50 L65 50 Z" fill="#f8fafc" />
    <path d="M92 0 L115 0 L115 50 L90 50 Z" fill="#2563eb" />
    <path d="M115 0 L138 0 L140 50 L115 50 Z" fill="#f8fafc" />
    <path d="M138 0 L160 0 L160 50 L140 50 Z" fill="#2563eb" />
    <!-- Scalloped bottom fringe -->
    <circle cx="10" cy="50" r="10" fill="#2563eb" />
    <circle cx="30" cy="50" r="10" fill="#f8fafc" />
    <circle cx="53" cy="50" r="10" fill="#2563eb" />
    <circle cx="78" cy="50" r="10" fill="#f8fafc" />
    <circle cx="102" cy="50" r="10" fill="#2563eb" />
    <circle cx="127" cy="50" r="10" fill="#f8fafc" />
    <circle cx="150" cy="50" r="10" fill="#2563eb" />
  </g>

  <!-- POS / Inventory Dashboard Screen inside Storefront -->
  <rect x="195" y="195" width="125" height="155" rx="14" fill="#f8fafc" filter="url(#glow)"/>
  <!-- Analytics bar charts -->
  <rect x="210" y="270" width="10" height="30" rx="3" fill="#00FFA3" />
  <rect x="225" y="250" width="10" height="50" rx="3" fill="#38bdf8" />
  <rect x="240" y="235" width="10" height="65" rx="3" fill="#2563eb" />
  <!-- Dashboard status pills -->
  <circle cx="295" cy="225" r="10" fill="#10b981"/>
  <text x="295" y="229" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">$</text>
  <circle cx="295" cy="255" r="10" fill="#8b5cf6"/>
  <circle cx="295" cy="285" r="10" fill="#f59e0b"/>
  <circle cx="295" cy="315" r="10" fill="#0284c7"/>

  <!-- Solana Luminous Glowing Badge (Bottom-Left) -->
  <g transform="translate(130, 260)">
    <circle cx="45" cy="45" r="48" fill="#060c18" stroke="url(#solanaGrad)" stroke-width="5" filter="url(#glow)"/>
    <circle cx="45" cy="45" r="40" fill="#091428"/>
    <!-- Solana 3 Slanted Bars Logo -->
    <g transform="translate(24, 25) scale(0.11)">
      <path d="M64.6 237.9c2.4-2.4 5.7-3.8 9.2-3.8h313.7c6.3 0 9.5 7.6 5.1 12l-55.5 55.6c-2.4 2.4-5.7 3.8-9.2 3.8H9.2c-6.3 0-9.5-7.6-5.1-12l60.5-55.6z" fill="url(#solanaGrad)"/>
      <path d="M64.6 3.8C67 1.4 70.3 0 73.8 0h313.7c6.3 0 9.5 7.6 5.1 12L337.1 67.6c-2.4 2.4-5.7 3.8-9.2 3.8H14.2c-6.3 0-9.5-7.6-5.1-12L64.6 3.8z" fill="url(#solanaGrad)"/>
      <path d="M332.6 120.8c-2.4-2.4-5.7-3.8-9.2-3.8H9.7c-6.3 0-9.5 7.6-5.1 12l55.5 55.6c2.4 2.4 5.7 3.8 9.2 3.8h313.7c6.3 0 9.5-7.6 5.1-12l-50.5-55.6z" fill="url(#solanaGrad)"/>
    </g>
  </g>
</svg>
